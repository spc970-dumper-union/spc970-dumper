name: CI & Build Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PS2 MechaCon Dumper ELF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile with ps2homebrew Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src ghcr.io/ps2homebrew/ps2homebrew:main make clean all

      - name: Check generated binaries
        run: |
          ls -lh ps2_mecha_tool.elf ps2_mecha_tool_stripped.elf

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps2_mecha_tool_binaries
          path: |
            ps2_mecha_tool.elf
            ps2_mecha_tool_stripped.elf
          if-no-files-found: error

      - name: Create Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ps2_mecha_tool.elf
            ps2_mecha_tool_stripped.elf
          generate_release_notes: true
