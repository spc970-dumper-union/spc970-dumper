name: CI & Build Release

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PS2 MechaCon Dumper ELF
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile with ps2homebrew Docker
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src ghcr.io/ps2homebrew/ps2homebrew:main make clean all

      - name: Check generated binaries
        run: |
          ls -lh ps2_mecha_tool.elf ps2_mecha_tool_stripped.elf

      - name: Package Release Archive
        run: |
          zip -9 ps2_mecha_tool.zip ps2_mecha_tool_stripped.elf ps2_mecha_tool.elf README.md

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps2_mecha_tool_binaries
          path: |
            ps2_mecha_tool.elf
            ps2_mecha_tool_stripped.elf
            ps2_mecha_tool.zip
          if-no-files-found: error

      - name: Create Automatic Pre-Release (Commits)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: true
          automatic_release_tag: "latest"
          title: "Development build"
          files: |
            ps2_mecha_tool.elf
            ps2_mecha_tool_stripped.elf
            ps2_mecha_tool.zip

      - name: Create Tagged Release (Tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            ps2_mecha_tool.elf
            ps2_mecha_tool_stripped.elf
            ps2_mecha_tool.zip
          generate_release_notes: true
